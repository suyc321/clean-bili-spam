  <body>
    <!--
      脱敏 B 站 UP 主主页（空间页）夹具。

      与前两个夹具的关键差别：
      1. 身份来自**页面地址里的 UID**（allowSpacePageFallback），
         卡片本身不需要作者链接——这是真实空间页的行为；
      2. 适配器会读 .nickname 与 .sign.header-sign，因此简介在这里可得。
         信息流卡片解析不到简介，是「两条简介类强信号在首页结构上不生效」的
         结构性根因，主页是唯一补上它的地方。

      本夹具的签名是「如有侵权，联系第一时间删除！」——侵权免责声明，
      即 repost-disclaimer 触发器。标题本身平淡无特征，用来证明该触发器
      只依赖简介、与标题无关。
    -->
    <div class="space-header">
      <a class="nickname" title="搬运小能手">搬运小能手</a>
      <div class="sign header-sign">如有侵权，联系第一时间删除！</div>
    </div>
